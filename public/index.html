<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Un plan para tu perro</title>
  <meta name="description" content="Planes de educación en positivo para tu perro, hechos para su raza, su edad y tu casa: cachorros, perros adoptados y problemas como tirar de la correa, ladrar o quedarse solo.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/styles.css">
  <script>
    // Compatibilidad: los anuncios antiguos de cachorro apuntaban a /?a=pis, etc.
    (function () {
      var q = new URLSearchParams(location.search), a = q.get('a');
      if (['pis', 'noches', 'mordiscos', 'solo', 'rutina'].indexOf(a) >= 0) location.replace('/cachorro' + location.search);
      else if (['correa', 'ladridos', 'soledad', 'adopcion'].indexOf(a) >= 0) location.replace('/perro' + location.search);
    })();
  </script>
</head>
<body>
  <header class="barra"><div class="barra-in" id="barra"></div></header>
  <main id="app"></main>
  <footer class="pie">
    <a href="/privacidad">Privacidad</a> · <a href="/condiciones">Condiciones</a> · <span id="pie-contacto"></span>
  </footer>
  <script src="/perros.js"></script>
  <script src="/inicio.js"></script>
</body>
</html>
