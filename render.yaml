# Render (la misma cuenta que Vigila). Crear con: New → Blueprint → lukas612/nuevoperro.
# Render solo pedirá las claves secretas (sync: false). Lo demás ya viene puesto,
# APP_SECRET se genera solo y la URL pública se detecta sola.
services:
  - type: web
    name: nuevoperro
    runtime: node
    plan: starter        # el plan free se duerme y el primer visitante de un anuncio esperaría ~30 s
    region: frankfurt
    branch: main
    buildCommand: echo ok
    startCommand: node server.js
    healthCheckPath: /salud
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MARCA
        value: Qué Buen Perro
      - key: SUPABASE_URL
        value: https://wwxlzvfxlfuodikcamlq.supabase.co
      - key: PRECIOS
        value: "999,1999"
      - key: PRECIO_UPSELL
        value: "999"
      - key: ADMIN_EMAILS
        value: lukas@witme.es
      - key: APP_SECRET
        generateValue: true
      # Las que Render te pedirá (puedes dejar en blanco las que aún no tengas):
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
